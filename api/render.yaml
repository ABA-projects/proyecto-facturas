# render.yaml — Deploy TaxOps API en Render (free tier)
# Docs: https://render.com/docs/yaml-spec

services:
  - type: web
    name: taxops-api
    runtime: docker
    # Build context = raíz del repo (necesitamos pipeline/, services/, db/, exogenas/)
    dockerfilePath: ./api/Dockerfile-api
    dockerContext: .
    # Plan free — se duerme tras 15 min sin tráfico
    # Upgrade a "starter" ($7/mes) para evitar cold starts con clientes reales
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # Pega la URL de Neon en el dashboard de Render
      - key: SECRET_KEY
        generateValue: true  # Render genera uno automáticamente
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: ALLOWED_ORIGINS
        value: https://taxops-web.vercel.app,http://localhost:3000
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAXOPS_SUPERADMIN_EMAILS
        sync: false
