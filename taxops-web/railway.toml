# railway.toml — Servicio: taxops-web
# Railway lee este archivo cuando el Root Directory del servicio es taxops-web/
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[build.args]
NEXT_PUBLIC_API_URL = "https://proyecto-facturas-production.up.railway.app"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
