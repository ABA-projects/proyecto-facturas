# railway.toml — Servicio: taxops-web
# Railway lee este archivo cuando el Root Directory del servicio es taxops-web/
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

# INTERNAL_API_URL se bake en next.config.ts durante npm run build
# Apunta al servicio taxops-api dentro de la red privada de Railway
[build.args]
INTERNAL_API_URL = "http://proyecto-facturas.railway.internal:8000"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
port = 3000
