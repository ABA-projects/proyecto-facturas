# railway.toml — Servicio: taxops-web
# Railway lee este archivo cuando el Root Directory del servicio es taxops-web/
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

# IMPORTANTE: Configurar en Railway Dashboard → taxops-web service → Variables:
#   INTERNAL_API_URL = <URL privada del servicio taxops-api en Railway>
#   Ejemplo: http://taxops-api.railway.internal:8000
#   (O la URL pública si no hay red privada configurada)

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
port = 3000
