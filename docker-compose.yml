# TaxOps — docker-compose
# Servicios: api (FastAPI), web (Next.js), db (PostgreSQL 16), adminer

services:

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: taxops_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taxops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxops_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-taxops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taxops} -d ${POSTGRES_DB:-taxops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Adminer — UI para PostgreSQL ─────────────────────────────────────────
  adminer:
    image: adminer:4
    container_name: taxops_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

  # ── FastAPI backend ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile-api
    container_name: taxops_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://taxops:taxops_local_2026@db:5432/taxops}
      SECRET_KEY: ${SECRET_KEY:-taxops_jwt_secret_2026_cambiar_en_produccion_min32}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TAXOPS_SUPERADMIN_EMAILS: ${TAXOPS_SUPERADMIN_EMAILS:-}
    volumes:
      - ./facturas:/app/facturas
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ── Next.js frontend ──────────────────────────────────────────────────────
  web:
    build:
      context: ./taxops-web
      dockerfile: Dockerfile
      args:
        INTERNAL_API_URL: http://api:8000
    container_name: taxops_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local

